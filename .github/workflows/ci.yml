name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This repository's job is to prove the engine stays domain-agnostic. So its CI
# fetches deck and runs all three demos unedited: if a change to deck breaks one,
# the change belonged in a pack.
jobs:
  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fetch deck
        run: git clone --depth 1 https://github.com/devfilipe/deck.git /tmp/deck

      - name: The hand-written descriptor demo
        run: DECK_BIN=/tmp/deck/plugins/deck/bin/deck ./demo.sh

      - name: The scope and consultation demo
        run: DECK_BIN=/tmp/deck/plugins/deck/bin/deck ./demo-scope.sh

      - name: The repo-manifest demo
        run: DECK_BIN=/tmp/deck/plugins/deck/bin/deck ./demo-repo.sh
